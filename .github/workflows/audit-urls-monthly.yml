name: Audit external_urls monthly (seed source)

# 月底 28 日 JST 05:00 に実行(google-business-status の 1 時間後にずらす)。
# URL の死活変動は週/月級なので月次で十分。bot block 回避として 4xx/DNS-fail のみ削除。
#
# Phase 2 (post-Supabase SUNSET, 2026-05-04) — DB 不要、seed source 直接編集。
#   1. audit:urls    — scripts/seed-japan-entries-*.ts をスキャン → 死鏈削除
#   2. 差分があれば auto-commit + push
on:
  schedule:
    - cron: "0 20 28 * *" # 月底 28 日 JST 05:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: audit-urls
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit + cleanup external_urls in seed source
        run: npm run audit:urls

      - name: Commit + push if seed source changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet scripts/seed-japan-entries-*.ts; then
            echo "[audit-urls] no changes — 死鏈なし or 全 KEEP"
            exit 0
          fi
          CHANGED=$(git diff --name-only scripts/seed-japan-entries-*.ts | wc -l)
          git add scripts/seed-japan-entries-*.ts
          git commit -m "chore(audit-urls): seed 死鏈清理 — 月次自動 (${CHANGED} ファイル)

          audit-urls-monthly.yml により自動コミット。
          seed source を直接 scan し、4xx + DNS-NX を削除。

          policy(変更なし):
          - 4xx (400/404/410) → 削除
          - ERR + DNS-NX → 削除
          - 5xx/403/DNS-OK → KEEP(bot block protection)

          🤖 Generated by GitHub Actions"
          git push
