name: Fetch carrier delays daily

# 毎日 JST 09:00 (UTC 00:00) に JP Post 運行 PDF を fetch、
# public/data/delivery_alerts.json を更新 + auto-commit。
# 公告無し時は空配列を書き込み、主頁の delivery alert marquee を非表示にする。

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 UTC 00:00 = JST 09:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-carrier-delays
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: npm ci

      - name: Fetch carrier delay snapshot
        run: npx tsx scripts/fetch-carrier-delays.ts

      - name: Commit + push if snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/data/delivery_alerts.json; then
            echo "[fetch-carrier-delays] no diff — snapshot unchanged"
            exit 0
          fi
          git add public/data/delivery_alerts.json
          git commit -m "chore(delivery-alerts): daily snapshot refresh

          Auto-committed by .github/workflows/fetch-carrier-delays.yml.
          Source: https://www.post.japanpost.jp/unkou.pdf

          🤖 Generated by GitHub Actions"
          git push
